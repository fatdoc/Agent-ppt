prompts:
  no_think.final_instruction:
    template: |
      请根据以上低描述输入，先完成需求归一化，再生成适合现场展示的争夺赛 PPT 主题、结构、页面重点和视觉表达。

      归一化要求：
      - 固定绑定“世界职业院校技能大赛/争夺赛”主线。
      - 把项目想法改写为竞赛现场可讲的任务语义：项目解决什么真实岗位任务、发生在什么现场、服务谁、四名选手如何协同完成。
      - 优先补全：岗位角色、工作流程、技能动作、数据采集/处置过程、服务对象收益、现场成果证据。
      - 避免营销型汇报结构，不要把重点放在市场规模、商业模式、融资、品牌宣传或泛泛产品亮点。

      PPT 生成要求：
      - 大纲应呈现“赛题理解/任务定义 -> 岗位现场痛点 -> 服务对象需求 -> 技术或工具方案 -> 四名选手分工与实施流程 -> 现场成果与评价指标 -> 总结陈述”的竞赛叙事。
      - 每页逐页描述应包含可视化建议，优先使用现场照片感、流程图、岗位动作、数据看板、前后对比、服务对象反馈等竞赛现场证据表达。
      - 输出应让评委快速判断：学生做了什么、在哪里做、为谁服务、怎么协作、产生了什么可验证成果。

  caption.image.zh:
    template: |
      请用一句简短的中文描述这张图片的主要内容。只返回描述文字，不要其他解释。

  caption.image.en:
    template: |
      Please provide a short description of the main content of this image. Return only the description text without any other explanation.

  settings.image_model_test:
    template: |
      生成一张简洁、明亮、适合演示文稿的背景图。

  codex.instructions.default:
    template: |
      You are a helpful assistant.

  codex.instructions.image_caption:
    template: |
      You are a helpful assistant that describes images.

  codex.instructions.image_generation:
    template: |
      You are a helpful assistant that generates images.

  inpainting.gemini.default:
    template: |
      你是一个专业的图片前景元素去除专家，以极高的精度进行前景元素的去除工作。
      现在用户向你提供了两张不同的图片：
      1. 原始图片
      2. 使用黑色矩形遮罩标注后的图片，黑色矩形区域表示要移除的前景元素，你只需要处理这些区域。

      你需要根据原始图片和黑色遮罩信息，重新绘制黑色遮罩标注的区域，去除前景元素，使得这些区域无缝融入周围的画面，就好像前景元素从来没有出现过。如果一个区域被整体标注，请你将其作为一个整体进行移除，而不是只移除其内部的内容。

      禁止遗漏任何一个黑色矩形标注的区域。
